[project]
name = "analyst-backend"
version = "0.1.0"
description = "Trust-first data preparation and insight platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "polars>=1.12.0",
    "duckdb>=1.1.2",
    "pandera[polars]>=0.20.4",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "boto3>=1.35.50",
    "anthropic>=0.37.1",
    "structlog>=24.4.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "weasyprint>=62.3",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "openpyxl>=3.1.5",
    "fastexcel>=0.11.0",
    "python-calamine>=0.9.0",
    "pyarrow>=17.0.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.1",
    "mypy>=1.13.0",
    "types-boto3>=1.35.50",
    "types-redis>=4.6.0.20241004",
    "types-openpyxl>=3.1.5.20240902",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "duckdb.*",
    "magic.*",
    "openpyxl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
